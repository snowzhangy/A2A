[project]
name = "a2a-runtime"
version = "0.1.0"
description = "A2A cross-platform live runtime (Windows and macOS): portable policy core, native mixer, workers"
requires-python = ">=3.12,<3.14"
# The host imports only NumPy and the native mixer. Models run in separate worker
# processes whose dependencies live in the `gpu` extra (ADR-0007).
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Inference workers: faster-whisper ASR, Qwen3 MT, OmniVoice cloning, Silero VAD.
# On Windows and Linux torch resolves to the CUDA 12.8 build; on macOS to the MPS build.
gpu = [
    "torch>=2.8",
    "torchaudio>=2.8",
    "faster-whisper>=1.2.1",
    # 4.8.1 fixes the word-alignment divide-by-zero on sub-two-frame windows
    # (OpenNMT/CTranslate2#2065), and 4.5+ shares torch's cuDNN 9.
    "ctranslate2>=4.8.1",
    "transformers>=5.3",
    "accelerate>=1.0",
    "omnivoice>=0.2.1",
    "soundfile>=0.12",
]
video = [
    "pillow>=12.3.0 ; sys_platform == 'win32'",
    "windows-capture>=2.0.1 ; sys_platform == 'win32'",
]

[project.scripts]
a2a-pipeline-portable = "a2a_runtime.cli:entry"
a2a-wintap = "a2a_runtime.tools.wintap:entry"

[dependency-groups]
dev = ["pytest>=8.3", "jsonschema>=4.23"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a2a_runtime"]

[tool.pytest.ini_options]
# Implicit locale encodings break Mandarin text on stock Windows code pages; scripts/check
# runs pytest with PYTHONWARNDEFAULTENCODING=1 so these become errors.
filterwarnings = ["error::EncodingWarning"]
testpaths = ["tests"]
pythonpath = ["."]
